apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sglang-platform
resources:
- workloads.yaml
configMapGenerator:
- name: sglang-alertmanager-config
  files:
  - alertmanager.yml
- name: sglang-alert-receiver-code
  files:
  - receiver.py
- name: sglang-alert-rules
  files:
  - alerts.yml
  options:
    disableNameSuffixHash: true

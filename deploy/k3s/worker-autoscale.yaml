apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang-worker
  namespace: sglang-platform
spec:
  progressDeadlineSeconds: 1200
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: sglang-worker
  template:
    metadata:
      labels:
        app: sglang-worker
    spec:
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 180
      containers:
        - name: engine
          image: lmsysorg/sglang@sha256:b1259f3ea3275f66237c498ea388919729018bc9f01c3d638391e06e2cf3f469
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "sglang.launch_server"]
          args:
            - --model-path
            - Qwen/Qwen3-0.6B
            - --revision
            - c1899de289a04d12100db370d81485cdf75e47ca
            - --served-model-name
            - qwen3-lab
            - --host
            - 0.0.0.0
            - --port
            - "30000"
            - --tensor-parallel-size
            - "1"
            - --api-key
            - $(SGLANG_API_KEY)
            - --enable-metrics
            - --mem-fraction-static
            - "0.6"
            - --context-length
            - "4096"
            - --max-running-requests
            - "8"
            - --max-queued-requests
            - "16"
          env:
            - name: SGLANG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sglang-engine-auth
                  key: api-key
          ports:
            - name: http
              containerPort: 30000
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 16Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 1
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: sglang-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi

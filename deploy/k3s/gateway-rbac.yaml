apiVersion: v1
kind: ServiceAccount
metadata:
  name: sglang-gateway
  namespace: sglang-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sglang-gateway
  namespace: sglang-platform
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sglang-gateway
  namespace: sglang-platform
subjects:
  - kind: ServiceAccount
    name: sglang-gateway
    namespace: sglang-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sglang-gateway
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-prometheus
  namespace: sglang-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-prometheus
  namespace: sglang-platform
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-prometheus
  namespace: sglang-platform
subjects:
  - kind: ServiceAccount
    name: lab-prometheus
    namespace: sglang-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lab-prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-prometheus
  namespace: sglang-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      scrape_timeout: 4s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: mock-worker
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [sglang-platform]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: mock-worker
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: http
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-prometheus
  namespace: sglang-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-prometheus
  template:
    metadata:
      labels:
        app: lab-prometheus
    spec:
      serviceAccountName: lab-prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.7.3@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1h
            - --storage.tsdb.retention.size=256MB
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: lab-prometheus
        - name: data
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: lab-prometheus
  namespace: sglang-platform
spec:
  type: ClusterIP
  selector:
    app: lab-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
